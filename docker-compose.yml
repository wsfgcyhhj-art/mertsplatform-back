version: '3.8'

services:
  backend:
    build:
      context: ./django_admin
      dockerfile: Dockerfile
    container_name: merts-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=False
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health?shallow=true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: merts-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  bot:
    build:
      context: ./django_admin
      dockerfile: Dockerfile
    container_name: merts-telegram-bot
    restart: unless-stopped
    command: ["python", "manage.py", "runbot"]
    env_file:
      - ./backend/.env
    depends_on:
      - backend

  telegram-delivery:
    build:
      context: ./django_admin
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "manage.py", "deliver_telegram"]
    env_file:
      - ./backend/.env
    depends_on:
      - backend
