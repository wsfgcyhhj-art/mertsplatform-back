services:
  django_web:
    image: mertsplatform-django:latest
    build:
      context: ./django_admin
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "False"
      TRUST_HTTPS_PROXY: "1"
    command:
      - sh
      - -c
      - >-
        python manage.py install_subscriptions &&
        python manage.py install_security &&
        python manage.py install_shop &&
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "-H", "Host: localhost", "-H", "X-Forwarded-Proto: https", "http://127.0.0.1:8000/api/v1/health?shallow=true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  telegram_worker:
    image: mertsplatform-django:latest
    restart: unless-stopped
    env_file: .env
    command: ["python", "manage.py", "deliver_telegram"]
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      django_web:
        condition: service_healthy

  node_api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      LEGACY_TELEGRAM_POLLING: "false"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      django_web:
        condition: service_healthy

volumes:
  media_data:
  static_data:
