services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  django_web:
    image: mertsplatform-django:latest
    build:
      context: ./django_admin
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "False"
      TRUST_HTTPS_PROXY: "1"
      AUTH_TRUSTED_PROXY_HOPS: "${AUTH_TRUSTED_PROXY_HOPS:-1}"
      TELEGRAM_MODE: "${TELEGRAM_MODE:-polling}"
      TELEGRAM_OUTBOX_EAGER: "${TELEGRAM_OUTBOX_EAGER:-False}"
    command:
      - sh
      - -c
      - >-
        python manage.py install_base_schema &&
        python manage.py install_subscriptions &&
        python manage.py install_security &&
        python manage.py install_shop --missing-only &&
        python manage.py migrate --noinput &&
        python manage.py createcachetable &&
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "-H", "Host: localhost", "-H", "X-Forwarded-Proto: https", "http://127.0.0.1:8000/api/v1/health?shallow=true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy

  telegram_worker:
    image: mertsplatform-django:latest
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_MODE: "${TELEGRAM_MODE:-polling}"
      TELEGRAM_OUTBOX_EAGER: "False"
    command: ["python", "manage.py", "deliver_telegram"]
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      django_web:
        condition: service_healthy

  telegram_bot:
    image: mertsplatform-django:latest
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_MODE: "${TELEGRAM_MODE:-polling}"
      TELEGRAM_OUTBOX_EAGER: "False"
    command: ["python", "manage.py", "runbot"]
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      django_web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  static_data:
