# Install in /etc/nginx/sites-available/ and enable via sites-enabled.
# Append your domain to server_name, then enable TLS (see deploy/README.md).
server {
    listen 80;
    listen [::]:80;
    server_name 166.0.28.165; # Example: 166.0.28.165 api.your-domain.tld;

    client_max_body_size 20M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # Current media URLs are /api/v1/media/{id}, stored in Neon.
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        # To route the API to Express, replace the line above with:
        # proxy_pass http://127.0.0.1:5000;
        # Keep /api/v1/telegram/webhook on Django when switching to Express.
    }
}
