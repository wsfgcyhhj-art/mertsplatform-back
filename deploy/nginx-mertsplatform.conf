# Install in /etc/nginx/sites-available/ and enable via sites-enabled.
# Append your domain to server_name, then enable TLS (see deploy/README.md).
server {
    listen 80;
    listen [::]:80;
    server_name 166.0.28.165 166.0.28.165.sslip.io;

    client_max_body_size 20M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # Current media URLs are /api/v1/media/{id}, stored in PostgreSQL.
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        # Forward proxy headers and CORS OPTIONS preflight requests directly to Django corsheaders.
        proxy_pass http://127.0.0.1:8000;
    }
}
