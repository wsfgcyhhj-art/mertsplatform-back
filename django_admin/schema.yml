components:
  schemas:
    Achievement:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
          title: Код ачивки
          maxLength: 128
        title:
          type: string
          title: Название
          maxLength: 255
        description:
          type: string
          title: Описание
        iconUrl:
          type: string
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          title: Категория
        triggerType:
          type: string
        threshold:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          title: Порог срабатывания (X)
          description: 'Числовое значение для триггеров баллов и заданий (например:
            100 для баллов или 5 для ДЗ). Для MANUAL / ON_REGISTER / EASTER_EGG оставьте
            пустым.'
        points:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Очки за ачивку (+pts)
        criteria:
          type: string
          nullable: true
          title: Критерий получения (текст для студента)
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
