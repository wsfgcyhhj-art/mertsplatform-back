openapi: 3.0.3
info:
  title: MertsPlatform LMS API
  version: 1.0.0
  description: 'Production REST API for MertsPlatform: Authentication, Curriculum,
    Homework Submissions, Media Assets & Dynamic Gamification Engine.'
paths:
  /api/v1/achievements:
    get:
      operationId: achievements_catalog
      summary: Каталог всех достижений платформы с отметкой о получении
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Achievement'
          description: ''
  /api/v1/admin/score-adjustments:
    post:
      operationId: admin_score_adjustment
      summary: Начисление или списание бонусных баллов ментором
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreAdjustmentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScoreAdjustmentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScoreAdjustmentRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreAdjustment'
          description: ''
  /api/v1/admin/stats:
    get:
      operationId: admin_stats
      summary: Сводная статистика учебной активности
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/users:
    get:
      operationId: admin_users_list
      summary: Список всех пользователей для панели ментора
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'
          description: ''
    post:
      operationId: v1_admin_users_create
      summary: Создать пользователя администратором
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/users/{id}/role:
    patch:
      operationId: admin_user_role
      summary: Изменить роль пользователя (STUDENT / ADMIN)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/csrf:
    get:
      operationId: v1_auth_csrf_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      summary: Аутентификация пользователя (логин + пароль)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      summary: Выход из системы и удаление сессии
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh
      summary: Обновление пары токенов по refresh-токену
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/register:
    post:
      operationId: v1_auth_register_create
      summary: Регистрация нового студента
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/reset-password:
    post:
      operationId: v1_auth_reset_password_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health:
    get:
      operationId: v1_health_retrieve
      summary: Проверка работоспособности сервиса (Health Check)
      parameters:
      - in: query
        name: shallow
        schema:
          type: boolean
        description: Быстрая проверка без обращения к БД
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/leaderboard:
    get:
      operationId: leaderboard_list
      summary: Таблица рейтинга студентов (лидерборд)
      parameters:
      - in: query
        name: groupNumber
        schema:
          type: string
        description: Фильтр по номеру группы
      - in: query
        name: month
        schema:
          type: integer
        description: Месяц обучения
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/lessons:
    get:
      operationId: lessons_list
      summary: Список видеоуроков курса
      parameters:
      - in: query
        name: groupNumber
        schema:
          type: string
        description: Фильтр по группе (для менторов)
      - in: query
        name: month
        schema:
          type: string
        description: Номер месяца или 'all'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lesson'
          description: ''
  /api/v1/media/{id}:
    get:
      operationId: v1_media_retrieve
      description: Возвращает оптимизированное бинарное изображение с кеширующими
        заголовками.
      summary: Получить медиа-ассет по ID (WebP / SVG)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: UUID медиафайла
        required: true
      tags:
      - v1
      responses:
        '200':
          description: Бинарные данные изображения
        '404':
          description: Медиа-ассет не найден
  /api/v1/media/presets:
    get:
      operationId: v1_media_presets_retrieve
      description: Возвращает списки готовых баннеров, аватарок и иконок достижений
        со встроенными dataUri и URL.
      summary: Каталог предустановленных медиа-ассетов
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/media/presets/avatars/{slug}:
    get:
      operationId: v1_media_presets_avatars_retrieve
      summary: Получить SVG-аватар по slug
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/media/presets/banners/{slug}:
    get:
      operationId: v1_media_presets_banners_retrieve
      summary: Получить SVG-баннер по slug
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/media/presets/icons/{slug}:
    get:
      operationId: v1_media_presets_icons_retrieve
      summary: Получить SVG-иконку ачивки по slug
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/shop/balance:
    get:
      operationId: v1_shop_balance_retrieve
      summary: Баланс магазина
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopBalance'
          description: ''
  /api/v1/shop/orders:
    post:
      operationId: v1_shop_orders_create
      summary: Покупка товара за баллы
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopPurchaseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShopPurchaseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShopPurchaseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopPurchaseResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopPurchaseResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopError'
          description: ''
  /api/v1/shop/orders/my:
    get:
      operationId: v1_shop_orders_my_list
      summary: История покупок студента
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShopOrder'
          description: ''
  /api/v1/shop/products:
    get:
      operationId: v1_shop_products_retrieve
      summary: Активные товары и баланс магазина
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopCatalog'
          description: ''
  /api/v1/submissions:
    get:
      operationId: submissions_list
      summary: Список решений (сдач) домашних заданий
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: Фильтр по статусу (SENT, IN_REVIEW, ACCEPTED, REVISION)
      - in: query
        name: taskId
        schema:
          type: string
        description: Фильтр по заданию
      - in: query
        name: userId
        schema:
          type: string
        description: Фильтр по студенту (для менторов)
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
          description: ''
    post:
      operationId: v1_submissions_create
      summary: Сдать решение задания на проверку ментору
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          description: ''
  /api/v1/submissions/{id}:
    get:
      operationId: submission_detail
      summary: Детальная информация о сдаче ДЗ
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          description: ''
    patch:
      operationId: v1_submissions_partial_update
      summary: Проверка ДЗ ментором (выставление статуса, баллов, комментария)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSubmissionReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSubmissionReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSubmissionReviewRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          description: ''
  /api/v1/system/config:
    get:
      operationId: v1_system_config_retrieve
      summary: Единый конфигурационный эндпоинт платформы для фронтенда
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/tasks:
    get:
      operationId: tasks_list
      summary: Список практических заданий
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: Номер месяца или 'all'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
          description: ''
    post:
      operationId: v1_tasks_create
      summary: Создать новое задание (только для ментора/админа)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{id}:
    get:
      operationId: task_detail
      summary: Детальная информация о задании
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    patch:
      operationId: v1_tasks_partial_update
      summary: Обновить задание (только для ментора/админа)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTaskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTaskRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    delete:
      operationId: v1_tasks_destroy
      summary: Удалить задание (только для ментора/админа)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/telegram/webhook:
    post:
      operationId: v1_telegram_webhook_create
      description: Принимает обновления от Telegram Bot API и обрабатывает команды
        /start, /status, /tasks (/hw), /help и /reset.
      summary: Telegram Bot Webhook Receiver
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/users/me:
    get:
      operationId: users_me_retrieve
      summary: Получить профиль, статистику и баланс магазина
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
          description: ''
    patch:
      operationId: users_me_update
      summary: Обновить данные профиля (имя, контакты, оформление)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/users/me/achievements:
    get:
      operationId: users_me_achievements
      summary: Список достижений текущего пользователя
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAchievement'
          description: ''
  /api/v1/users/me/avatar:
    post:
      operationId: users_me_avatar_upload
      summary: Загрузить аватар профиля (оптимизация до WebP 256x256)
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/users/me/banner:
    post:
      operationId: users_me_banner_upload
      summary: Загрузить баннер профиля (оптимизация до WebP 1600x400)
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/users/me/easter-egg:
    post:
      operationId: users_me_easter_egg
      summary: Активация пасхалки и получение ачивки
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/users/me/password:
    put:
      operationId: users_me_change_password
      summary: Смена пароля пользователя
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/users/me/telegram/connect:
    post:
      operationId: users_me_telegram_connect
      description: Генерирует уникальный auth-код и возвращает прямую ссылку на бота
        вида https://t.me/Bot?start=CODE
      summary: Инициализировать привязку Telegram
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/users/me/telegram/disconnect:
    delete:
      operationId: users_me_telegram_disconnect
      summary: Отвязать Telegram-бота от аккаунта
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    Achievement:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
          title: Код ачивки
          maxLength: 128
        title:
          type: string
          title: Название
          maxLength: 255
        description:
          type: string
          title: Описание
        iconUrl:
          type: string
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          title: Категория
        triggerType:
          type: string
        threshold:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          title: Порог срабатывания (X)
          description: 'Числовое значение для триггеров баллов и заданий (например:
