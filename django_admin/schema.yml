openapi: 3.0.3
info:
  title: MertsPlatform LMS API
  version: 1.0.0
  description: 'Production REST API for MertsPlatform: Authentication, Curriculum,
    Homework Submissions, Media Assets & Dynamic Gamification Engine.'
paths:
  /api/v1/achievements:
    get:
      operationId: achievements_catalog
      summary: Каталог всех достижений платформы с отметкой о получении
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Фильтр по категории
      - in: query
        name: limit
        schema:
          type: integer
        description: Размер страницы
      - in: query
        name: ordering
        schema:
          type: string
        description: Сортировка (points, created_at, title)
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию, коду, описанию
      - in: query
        name: triggerType
        schema:
          type: string
        description: Фильтр по типу триггера
      - in: query
        name: unlocked
        schema:
          type: boolean
        description: Только открытые/закрытые для текущего пользователя
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementsListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/achievements/{id}:
    get:
      operationId: achievements_retrieve
      summary: Детальная информация о достижении
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/admin/score-adjustments:
    post:
      operationId: admin_score_adjustment
      summary: Начисление или списание бонусных баллов ментором
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreAdjustmentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScoreAdjustmentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScoreAdjustmentRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreAdjustment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/admin/stats:
    get:
      operationId: admin_stats
      summary: Сводная статистика учебной активности
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/admin/users:
    get:
      operationId: admin_users_list
      summary: Список всех пользователей для панели ментора
      parameters:
      - in: query
        name: currentMonth
        schema:
          type: integer
        description: Фильтр по текущему месяцу
      - in: query
        name: groupNumber
        schema:
          type: string
        description: Фильтр по группе
      - in: query
        name: limit
        schema:
          type: integer
        description: Размер страницы
      - in: query
        name: ordering
        schema:
          type: string
        description: Сортировка (createdAt, login, name, currentMonth, streakCount)
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы
      - in: query
        name: role
        schema:
          type: string
        description: Фильтр по роли (STUDENT, ADMIN)
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по логину, имени или Telegram
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    post:
      operationId: v1_admin_users_create
      summary: Создать пользователя администратором
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/admin/users/{id}/role:
    patch:
      operationId: admin_user_role
      summary: Изменить роль пользователя (STUDENT / ADMIN)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRoleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/csrf:
    get:
      operationId: v1_auth_csrf_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      summary: Аутентификация пользователя (логин + пароль)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      summary: Выход из системы и удаление сессии
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh
      summary: Обновление пары токенов по refresh-токену
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: v1_auth_register_create
      summary: Регистрация нового студента
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/reset-password:
    post:
      operationId: v1_auth_reset_password_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/telegram-webapp:
    post:
      operationId: auth_telegram_webapp
      summary: Авторизация в Telegram Mini App по подписанному initData
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramWebAppAuthRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramWebAppAuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/telegram-webapp/link:
    post:
      operationId: auth_telegram_webapp_link
      summary: Привязка существующего аккаунта студента к Telegram Mini App
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramWebAppLinkRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/health:
    get:
      operationId: v1_health_retrieve
      summary: Проверка работоспособности сервиса (Health Check)
      parameters:
      - in: query
        name: shallow
        schema:
          type: boolean
        description: Быстрая проверка без обращения к БД
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
  /api/v1/leaderboard:
    get:
      operationId: leaderboard_list
      summary: Таблица рейтинга студентов (лидерборд)
      parameters:
      - in: query
        name: groupNumber
        schema:
          type: string
        description: Фильтр по номеру группы
      - in: query
        name: limit
        schema:
          type: integer
        description: Количество записей на странице (1-200)
      - in: query
        name: month
        schema:
          type: string
        description: Месяц обучения (число или 'all'; без параметра — за всё время)
      - in: query
        name: ordering
        schema:
          type: string
        description: Сортировка (totalScore, tasksAcceptedCount, streakCount)
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по логину, имени или группе
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/leaderboard/groups:
    get:
      operationId: leaderboard_groups_list
      summary: Битва учебных групп (агрегированный рейтинг по среднему баллу)
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: Месяц обучения (1..24 или 'all')
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupLeaderboardEntry'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/lessons:
    get:
      operationId: lessons_list
      summary: Список видеоуроков курса
      parameters:
      - in: query
        name: groupNumber
        schema:
          type: string
        description: Фильтр по группе (для менторов)
      - in: query
        name: limit
        schema:
          type: integer
        description: Размер страницы
      - in: query
        name: month
        schema:
          type: string
        description: Номер месяца или 'all'
      - in: query
        name: ordering
        schema:
          type: string
        description: Сортировка (month, order, title, createdAt)
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию или YouTube ID
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonsListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/me/claim-easter-egg:
    post:
      operationId: me_claim_easter_egg
      summary: Алиас активации пасхалки и получения ачивки
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EasterEggResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EasterEggResponse'
          description: ''
  /api/v1/media/{id}:
    get:
      operationId: v1_media_retrieve
      description: Возвращает оптимизированное бинарное изображение с кеширующими
        заголовками.
      summary: Получить медиа-ассет по ID (WebP / PNG / JPEG / GIF)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: UUID медиафайла
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: Бинарные данные изображения
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/media/instruction:
    get:
      operationId: v1_media_instruction_retrieve
      description: Отдаёт активный PDF-файл инструкции из MediaAsset (instruction_pdf_asset_id
        или последний DOCUMENT) либо встроенный дефолтный PDF.
      summary: Скачать PDF-инструкцию платформы (MertsPlatform_Instruction.pdf)
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: PDF-файл инструкции
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/media/presets:
    get:
      operationId: v1_media_presets_retrieve
      description: Возвращает списки готовых баннеров, аватарок и иконок достижений
        со встроенными dataUri и URL.
      summary: Каталог предустановленных медиа-ассетов
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPresetsCatalogResponse'
          description: ''
  /api/v1/media/presets/avatars/{slug}:
    get:
      operationId: v1_media_presets_avatars_retrieve
      summary: Получить SVG-аватар по slug
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: SVG-изображение
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/media/presets/banners/{slug}:
    get:
      operationId: v1_media_presets_banners_retrieve
      summary: Получить SVG-баннер по slug
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: SVG-изображение
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/media/presets/icons/{slug}:
    get:
      operationId: v1_media_presets_icons_retrieve
      summary: Получить SVG-иконку ачивки по slug
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: SVG-изображение
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/shop/balance:
    get:
      operationId: v1_shop_balance_retrieve
      summary: Баланс магазина
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopBalance'
          description: ''
  /api/v1/shop/orders:
    post:
      operationId: v1_shop_orders_create
      summary: Покупка товара за баллы
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopPurchaseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShopPurchaseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShopPurchaseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopPurchaseResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
